      <div class="contact-links reveal">
        <a class="contact-link primary" href="mailto:sarthak@example.com">
          <span>✉ Email Me</span>

        </a>

          <span class="contact-link-arrow">⤢</span>

          <span>Instagram</span>
          <span class="contact-link-arrow">⤢</span>
        </a>

    </div>
  </div>
