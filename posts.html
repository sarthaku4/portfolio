<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sarth Infocus — Made in Evolve</title>
  <meta name="description" content="Sarthak Ubale — designer, developer, and photographer.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;600&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/split-type"></script>
</head>
<body data-barba="wrapper">

<!-- DECORATIVE GRID OVERLAY -->
<div class="grid-overlay" id="gridOverlay"></div>

<!-- BARBA TRANSITION PANEL -->
<div class="transition__panel">
  <div class="transition__panel-text">loading...</div>
</div>

<!-- PAGE LOADER (Only runs once) -->
<div class="loader" id="pageLoader">
  <div class="loader-grid" id="loaderGrid"></div>
  <div class="loader-content">
    <div class="loader-counter" id="loaderCounter">00</div>
    <div class="loader-text" id="loaderText">Please Wait</div>
  </div>
</div>

<!-- NAVIGATION -->
<nav class="site-nav">
  <button class="nav-logo" aria-label="Home" onclick="location.href='index.html'">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="12" cy="12" r="10"></circle>
      <path d="M12 2v20M2 12h20"></path>
    </svg>
  </button>
  <div class="nav-links">
    <a href="work.html" data-underline-link>Work</a>
    <a href="about.html" data-underline-link>About</a>
    <a href="posts.html" data-underline-link>Posts</a>
  </div>
  <button class="nav-menu-btn" id="menuBtn" aria-label="Menu" onclick="window.toggleMenu()">Menu</button>
</nav>

<!-- MOBILE MENU -->
<div class="mobile-menu" id="mobileMenu">
  <a href="index.html" data-underline-link>Home</a>
  <a href="work.html" data-underline-link>Work</a>
  <a href="about.html" data-underline-link>About</a>
  <a href="posts.html" data-underline-link>Posts</a>
  <a href="contact.html" data-underline-link>Contact</a>
</div>

<main data-barba="container" data-barba-namespace="posts">
  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox" onclick="window.closeLightbox()">
    <span class="lightbox-close">Close [ESC]</span>
    <img id="lightboxImg" src="" alt="Full view">
  </div>

  <!-- LATEST POSTS -->
  <section class="latest-hero">
    <h1 class="latest-title reveal">
      <span>ALL MY WORK</span>
    </h1>
    
    <div class="latest-grid reveal">
      <div class="latest-card" onclick="openLightbox('asset/latest_post/WhatsApp Image 2026-05-14 at 10.40.08 PM.jpeg')">
        <img src="asset/latest_post/WhatsApp Image 2026-05-14 at 10.40.08 PM.jpeg" alt="Latest 1">
        <div class="latest-card-overlay">
          <div>
            <div class="latest-card-tag">Latest Upload</div>
            <h3>Featured Piece — I</h3>
          </div>
        </div>
      </div>
      <div class="latest-card" onclick="openLightbox('asset/latest_post/WhatsApp Image 2026-05-14 at 10.41.12 PM.jpeg')">
        <img src="asset/latest_post/WhatsApp Image 2026-05-14 at 10.41.12 PM.jpeg" alt="Latest 2">
        <div class="latest-card-overlay">
          <div>
            <div class="latest-card-tag">Latest Upload</div>
            <h3>Featured Piece — II</h3>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- FULL GALLERY -->
  <section class="gallery-section">
    <div class="gallery-header reveal">
      <span class="gallery-header-title">ARCHIVE / GALLERY</span>
    </div>

    <div class="gallery-grid" id="galleryGrid"></div>
  </section>
</main>

<!-- SCRIPTS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Flip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollToPlugin.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.3.17/bundled/lenis.min.js"></script>
<script src="https://unpkg.com/@barba/core@2.10.3/dist/barba.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.11/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/unicorn-studio@2.0.3/dist/unicorn-studio.umd.js"></script>

<!-- The new animation engine script -->
<script src="engine.js"></script>
<script src="main.js"></script>
<script src="framer.js"></script>
<script src="index.js"></script>
</body>
</html>
